name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-build.lock
      - run: python -m pip install -r requirements-build.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pytest
      - run: python scripts/check_docs.py
      - run: pyinstaller --noconfirm --clean pigeon.spec
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/Pigeon | Out-Null
          Copy-Item dist/Pigeon.exe, LICENSE, README.md, QUICKSTART.md, RELEASE_NOTES.md, SECURITY.md, THIRD_PARTY_NOTICES.md release/Pigeon/
          Copy-Item guide release/Pigeon/guide -Recurse
          New-Item -ItemType Directory -Force release/Pigeon/docs | Out-Null
          Copy-Item docs/architecture.md, docs/development-history.md, docs/development.md, docs/privacy-and-security.md, docs/troubleshooting.md release/Pigeon/docs/
          Copy-Item shortcuts release/Pigeon/shortcuts -Recurse
          Copy-Item licenses release/Pigeon/licenses -Recurse
          Compress-Archive -Path release/Pigeon -DestinationPath release/Pigeon-windows-x64.zip
          $hash = (Get-FileHash -Algorithm SHA256 release/Pigeon-windows-x64.zip).Hash.ToLowerInvariant()
          "$hash  Pigeon-windows-x64.zip" | Set-Content -Encoding ascii release/Pigeon-windows-x64.zip.sha256
          Copy-Item RELEASE_NOTES.md release/RELEASE_NOTES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Pigeon-windows-x64
          path: |
            release/Pigeon-windows-x64.zip
            release/Pigeon-windows-x64.zip.sha256
            release/RELEASE_NOTES.md
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Pigeon-windows-x64
          path: release-assets
      - name: Verify release archive
        shell: pwsh
        run: |
          $expected = (Get-Content release-assets/Pigeon-windows-x64.zip.sha256).Split()[0]
          $actual = (Get-FileHash -Algorithm SHA256 release-assets/Pigeon-windows-x64.zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Release archive SHA-256 mismatch: expected $expected, got $actual"
          }
      - name: Create or update draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            "release-assets/Pigeon-windows-x64.zip",
            "release-assets/Pigeon-windows-x64.zip.sha256"
          )
          $isDraft = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($isDraft -ne "true") {
              throw "Refusing to replace assets on published release $tag"
            }
            gh release edit $tag --title "Pigeon $tag" --notes-file release-assets/RELEASE_NOTES.md
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --draft --title "Pigeon $tag" --notes-file release-assets/RELEASE_NOTES.md
          }
